packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msw: true


# Save exact external versions; internal dependencies use workspace:*.
saveExact: true

# Consume our own releases immediately; age-check third-party packages.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@mp-lb/*'
