project: zog
env_files:
  - .env.local
  - .env
homepage: http://localhost:${DOCS_PORT}/docs
ports:
  - DOCS_PORT
native:
  docs:
    cmd: pnpm --filter @mp-lb/zog-docs dev --host 0.0.0.0 --port ${DOCS_PORT}
    env: "*"
tasks:
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  typecheck:
    cmds:
      - pnpm typecheck
  test:
    cmds:
      - pnpm test
  worktree_setup:
    cmds:
      - pnpm install
