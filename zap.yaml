project: zog
env-files:
  - .env.local
  - .env
homepage: http://localhost:${LANDING_PAGE_PORT}
links:
  - name: Landing Page
    url: http://localhost:${LANDING_PAGE_PORT}
  - name: Docs
    url: http://localhost:${DOCS_PORT}
ports:
  - LANDING_PAGE_PORT
  - DOCS_PORT
native:
  landing-page:
    aliases: [landing]
    cmd: VITE_ZOG_DOCS_URL=http://localhost:${DOCS_PORT} pnpm --filter @mp-lb/zog-docs dev --host 0.0.0.0 --port ${LANDING_PAGE_PORT}
    env: "*"
  docs:
    cmd: ZOG_SITE_MODE=docs pnpm --filter @mp-lb/zog-docs dev --host 0.0.0.0 --port ${DOCS_PORT}
    env: "*"
tasks:
  secrets-unlock:
    cmds:
      - dx decrypt --file docs/env.local.enc > .env
  secrets-lock:
    cmds:
      - dx encrypt --file .env > docs/env.local.enc
  secrets-check:
    cmds:
      - |
        dx decrypt --file docs/env.local.enc > /tmp/.env.check 2>/dev/null || { echo "no docs/env.local.enc"; exit 0; }
        if ! diff -q /tmp/.env.check .env >/dev/null 2>&1; then echo "WARN: .env differs from docs/env.local.enc - run: zap t secrets-lock"; rm -f /tmp/.env.check; exit 1; fi
        rm -f /tmp/.env.check; echo "secrets in sync"
  context-build:
    cmds:
      - node scripts/context-files.mjs build {{REST}}
  context-copy:
    cmds:
      - node scripts/context-files.mjs copy {{REST}}
  compile-agents:
    cmds:
      - zap task context-build -- ~/Code/mgr/agents-md/global.md
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  lint:
    cmds:
      - |
        if [ -n "{{REST}}" ]; then
          pnpm exec eslint {{REST}}
        else
          pnpm lint
        fi
  check:
    cmds:
      - zap task lint -- {{REST}}
      - pnpm typecheck
  typecheck:
    cmds:
      - pnpm typecheck
  test:
    cmds:
      - pnpm test
  worktree-setup:
    cmds:
      - pnpm install
      - grep -qxF '@AGENTS_WORKTREE.md' AGENTS.md || printf '\n@AGENTS_WORKTREE.md\n' >> AGENTS.md
