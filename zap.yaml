project: zog
env-files:
  - .env.local
  - .env
homepage: http://localhost:${LANDING_PAGE_PORT}
links:
  - name: Landing Page
    url: http://localhost:${LANDING_PAGE_PORT}
  - name: Docs
    url: http://localhost:${DOCS_PORT}
ports:
  - LANDING_PAGE_PORT
  - DOCS_PORT
native:
  landing-page:
    aliases: [landing]
    cmd: VITE_ZOG_DOCS_URL=http://localhost:${DOCS_PORT} pnpm --filter @mp-lb/zog-docs dev --host 0.0.0.0 --port ${LANDING_PAGE_PORT}
    env: "*"
  docs:
    cmd: ZOG_SITE_MODE=docs pnpm --filter @mp-lb/zog-docs dev --host 0.0.0.0 --port ${DOCS_PORT}
    env: "*"
tasks:
  compile-agents:
    cmds:
      - npx -y @mp-lb/mdcompile agents-md/index.md -o AGENTS.md --optional --silent
      - npx -y @mp-lb/mdcompile agents-md/index.md -o CLAUDE.md --optional --silent
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  typecheck:
    cmds:
      - pnpm typecheck
  test:
    cmds:
      - pnpm test
  worktree-setup:
    cmds:
      - pnpm install
      - grep -qxF '@AGENTS_WORKTREE.md' AGENTS.md || printf '\n@AGENTS_WORKTREE.md\n' >> AGENTS.md
