name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint packages/scripts && pnpm typecheck && pnpm test && pnpm build
      - name: Publish changed package builds
        id: publish
        run: pnpm exec arcnet env run --consumer publish -- pnpm exec arcnet packages publish --github-output="$GITHUB_OUTPUT"
        env:
          ARCNET_STANDARD_SECRETS_KEY: ${{ secrets.ARCNET_STANDARD_SECRETS_KEY }}
      - name: Verify exact public versions
        run: pnpm exec arcnet packages verify
        env:
          ARCNET_RELEASE_RESULT: ${{ steps.publish.outputs.release_report }}
