name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect pending changesets
        id: changesets
        shell: bash
        run: |
          count=$(find .changeset -maxdepth 1 -type f -name "*.md" ! -name "README.md" | wc -l | tr -d " ")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: ${{ steps.changesets.outputs.count != '0' }}
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: ${{ steps.changesets.outputs.count != '0' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        if: ${{ steps.changesets.outputs.count != '0' }}
        run: pnpm install --frozen-lockfile

      - name: Apply Changesets version
        if: ${{ steps.changesets.outputs.count != '0' }}
        run: pnpm changeset version

      - name: Verify
        if: ${{ steps.changesets.outputs.count != '0' }}
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit version changes
        if: ${{ steps.changesets.outputs.count != '0' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset pnpm-lock.yaml packages/*/package.json packages/*/CHANGELOG.md
          git commit -m "chore: release packages [skip ci]"

      - name: Load npm publish token
        if: ${{ steps.changesets.outputs.count != '0' }}
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
        run: |
          set -euo pipefail
          npx -y @mp-lb/doctrine-secrets decrypt docs/secrets.json.enc --secret "$SECRETS_KEY" > secrets.json
          TOKEN=$(jq -r '.NPM_TOKEN' secrets.json)
          rm -f secrets.json
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "NPM_TOKEN missing from docs/secrets.json.enc" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          {
            echo "NPM_TOKEN=$TOKEN"
            echo "NODE_AUTH_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

      - name: Publish
        if: ${{ steps.changesets.outputs.count != '0' }}
        run: pnpm changeset publish
        # NPM_TOKEN / NODE_AUTH_TOKEN come from the "Load npm publish token" step
        # (decrypted from docs/secrets.json.enc), not a GitHub secret.

      - name: Push release commit and tags
        if: ${{ steps.changesets.outputs.count != '0' }}
        run: git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
